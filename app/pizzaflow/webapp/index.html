<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PizzaFlow - Pizza Restaurant Operations</title>

    <!--
      Bootstrap the SAPUI5 runtime from SAP's CDN.
      The version is pinned (1.148 = long-term maintenance release), so the app
      behaves the same today and during the workshop. Requires internet access.
    -->
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.148.13/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{ "pizzaflow": "./" }'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
      data-sap-ui-xx-component-preload="off"
    ></script>
  </head>
  <body class="sapUiBody">
    <!-- ComponentSupport finds this element and starts the component "pizzaflow" -->
    <div
      data-sap-ui-component
      data-name="pizzaflow"
      data-id="container"
      data-settings='{ "id": "pizzaflow" }'
      data-height="100%"
    ></div>
  </body>
</html>
